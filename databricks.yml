bundle:
  name: canonpulse

include:
  - resources/*.yml

# Variable names here must match the ${...} placeholders in sql/. A placeholder
# with no variable behind it deploys as the literal string "${db}", and that
# fails only inside a workspace -- the one environment this repo cannot exercise
# in CI. tests/test_databricks_assets.py pins the coupling instead.
variables:
  catalog:
    description: Unity Catalog that owns CanonPulse tables and lineage.
    default: writers_room
  db:
    description: Unity Catalog schema for CanonPulse assets.
    default: canonpulse
  warehouse_id:
    description: Serverless SQL warehouse running the ai_query extraction and cohort batches.
    default: c4cfcc95726ac7d5
  model:
    description: >-
      Foundation Model APIs endpoint serving both graph extraction and cohort
      reactions. All product inference runs here rather than against a vendor
      SDK, so every call carries Unity Catalog lineage and an MLflow trace.
    default: databricks-gpt-oss-20b
  mlflow_experiment_id:
    description: MLflow experiment holding training runs, held-out error, and traces.
    default: 4189279848712062

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: DEFAULT
