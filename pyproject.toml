[project]
name = "canonpulse"
version = "0.1.0"
description = "Narrative debt analysis for serialized audio stories."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
