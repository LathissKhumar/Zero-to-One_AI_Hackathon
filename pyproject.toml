[project]
name = "canonpulse"
version = "0.1.0"
description = "Narrative debt analysis for serialized audio stories."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "pyyaml>=6.0,<7",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is run in place, not installed, so pytest needs the repo root on
# sys.path to import `app`. Without this, plain `pytest` cannot collect.
pythonpath = ["."]
