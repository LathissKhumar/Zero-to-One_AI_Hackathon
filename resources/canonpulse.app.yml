resources:
  apps:
    canonpulse:
      name: canonpulse-${bundle.target}
      description: >-
        Separates real plot holes from intentional narrative twists across a full
        serialized series, with cited evidence and a predicted next-episode
        continuation.
      source_code_path: ..
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.model}
            permission: CAN_QUERY
        - name: mlflow-experiment
          experiment:
            experiment_id: ${var.mlflow_experiment_id}
            permission: CAN_EDIT
