command:
  - python
  - -m
  - uvicorn
  - app.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: DEMO_MODE
    value: "false"
  - name: DATABRICKS_CATALOG
    value: "writers_room"
  - name: DATABRICKS_SCHEMA
    value: "canonpulse"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Foundation Model APIs endpoint. All product inference routes here, so calls
  # carry Unity Catalog lineage and MLflow traces rather than leaving the
  # platform. Leave empty to run the app in DEMO_MODE off committed data.
  - name: SERVING_MODEL_ENDPOINT
    valueFrom: serving-endpoint
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: mlflow-experiment
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
